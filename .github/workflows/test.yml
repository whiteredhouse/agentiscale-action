name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the script
        if: runner.os == 'Linux'
        run: shellcheck join.sh
      - name: Test against stand-in endpoints
        run: python3 -I tests/test_join.py -v
